<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BG Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #6c5ce7;
      --primary-dark: #5a4bd1;
      --danger:       #e17055;
      --bg:           #f4f6fb;
      --card:         #ffffff;
      --border:       #e2e8f0;
      --text:         #2d3748;
      --muted:        #718096;
      --shadow:       0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg:    0 20px 60px rgba(0,0,0,0.18);
      --radius:       14px;
      --sidebar-bg:   #1a1a2e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(circle at 15% 85%, rgba(108,92,231,.10) 0%, transparent 55%),
        radial-gradient(circle at 85% 15%, rgba(108,92,231,.07) 0%, transparent 55%);
    }

    /* ── CARD ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: cardIn .35s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.96); }
      to   { opacity: 1; transform: none; }
    }

    /* ── HEADER BAR ── */
    .login-header {
      background: var(--sidebar-bg);
      padding: 32px 36px 28px;
      text-align: center;
    }

    .login-logo {
      font-size: 36px;
      line-height: 1;
      margin-bottom: 10px;
      display: block;
    }

    .login-brand {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .login-brand span {
      color: var(--primary);
    }

    .login-tagline {
      font-size: 12px;
      color: #6b7299;
      margin-top: 5px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ── BODY ── */
    .login-body {
      padding: 32px 36px 36px;
    }

    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 0 14px 0 42px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,92,231,.12);
    }

    .form-group input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(225,112,85,.12);
    }

    /* Toggle show/hide password */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      padding: 4px;
      border-radius: 6px;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* ── ERROR BOX ── */
    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fff5f3;
      border: 1.5px solid #fcd5cc;
      border-radius: 10px;
      padding: 11px 15px;
      font-size: 13px;
      color: #c0392b;
      font-weight: 500;
      margin-bottom: 18px;
      animation: shake .35s ease;
    }

    .error-box.show { display: flex; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
    }

    /* ── SUBMIT BUTTON ── */
    .btn-login {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background .2s, transform .15s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover  { background: var(--primary-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    .login-footer {
      border-top: 1px solid var(--border);
      padding: 16px 36px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .login-footer b { color: var(--primary); }

    /* ── SUCCESS FLASH ── */
    .success-flash {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 20px;
      text-align: center;
    }
    .success-flash.show { display: flex; }
    .success-icon { font-size: 48px; animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .success-sub   { font-size: 13px; color: var(--muted); }
    .progress-bar  {
      width: 100%; height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      animation: fillBar 1.6s ease forwards;
    }
    @keyframes fillBar { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body>

<div class="login-card">

  <!-- HEADER -->
  <div class="login-header">
    <span class="login-logo">🎲</span>
    <div class="login-brand">BG <span>Admin</span></div>
    <div class="login-tagline">Hệ thống quản trị Boardgame</div>
  </div>

  <!-- BODY -->
  <div class="login-body" id="loginBody">
    <div class="login-title">Đăng nhập</div>
    <div class="login-sub">Nhập email và mật khẩu tài khoản quản trị để tiếp tục</div>

    <!-- ERROR -->
    <div class="error-box" id="errorBox">
      <span>⚠️</span>
      <span id="errorText">Email hoặc mật khẩu không đúng.</span>
    </div>

    <!-- FORM -->
    <div class="form-group">
      <label for="usernameInput">Email</label>
      <div class="input-wrap">
        <span class="icon">👤</span>
        <input type="email" id="usernameInput" placeholder="ten@thecoffeequest.com" autocomplete="username" autocapitalize="none">
      </div>
    </div>

    <div class="form-group">
      <label for="passwordInput">Mật khẩu</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
        <button class="toggle-pw" id="togglePw" type="button" title="Hiện/ẩn mật khẩu">👁</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" type="button">
      <span id="btnText">Đăng nhập</span>
    </button>
  </div>

  <!-- SUCCESS STATE -->
  <div class="success-flash" id="successFlash">
    <div class="success-icon">✅</div>
    <div class="success-title">Đăng nhập thành công!</div>
    <div class="success-sub">Đang chuyển hướng đến Dashboard...</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <!-- FOOTER -->
  <div class="login-footer">
    <b>BG Admin</b> — Chỉ dành cho quản trị viên
  </div>

</div>

<script src="../js/shared-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ══════════════════════════════════════════════
   CONFIG
   ─────────────────────────────────────────────
   ⚠️ ĐÃ ĐỔI (2026-07-18): dùng Supabase Auth thật
   (auth.users) thay cho tự hash SHA-256 + so sánh tay
   với bảng admin_users.password_hash.

   Session giờ do Supabase tự quản lý (lưu trong
   localStorage dưới key riêng của supabase-js) —
   KHÔNG dùng sessionStorage["bg_admin_session"] nữa.
   core/dashboard-auth.js đã được cập nhật tương ứng
   để đọc session qua client.auth.getSession().
   ══════════════════════════════════════════════ */
const SUPABASE_URL = window.APP_CONFIG.supabaseUrl;
const SUPABASE_KEY = window.APP_CONFIG.supabaseKey;
const DASHBOARD    = "dashboard.html";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ══════════════════════════════════════════════
   NẾU ĐÃ ĐĂNG NHẬP (session Supabase còn hiệu lực)
   → REDIRECT NGAY
   ══════════════════════════════════════════════ */
(async function checkExistingSession() {
  const { data: { session } } = await client.auth.getSession();
  if (session) location.replace(DASHBOARD);
})();

/* ══════════════════════════════════════════════
   DOM REFS
   ══════════════════════════════════════════════ */
const usernameInput = document.getElementById("usernameInput"); // giờ là email
const passwordInput = document.getElementById("passwordInput");
const loginBtn      = document.getElementById("loginBtn");
const btnText       = document.getElementById("btnText");
const errorBox      = document.getElementById("errorBox");
const errorText     = document.getElementById("errorText");
const togglePw      = document.getElementById("togglePw");
const loginBody     = document.getElementById("loginBody");
const successFlash  = document.getElementById("successFlash");

/* ── TOGGLE PASSWORD VISIBILITY ── */
togglePw.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";
  togglePw.textContent = isHidden ? "🙈" : "👁";
});

/* ── CLEAR ERROR KHI GÕ ── */
[usernameInput, passwordInput].forEach(el => {
  el.addEventListener("input", () => {
    errorBox.classList.remove("show");
    el.classList.remove("error");
  });
});

/* ── ENTER TO SUBMIT ── */
passwordInput.addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});
usernameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") passwordInput.focus();
});

/* ══════════════════════════════════════════════
   LOGIN LOGIC
   ══════════════════════════════════════════════ */
function showError(msg) {
  errorText.textContent = msg || "Email hoặc mật khẩu không đúng.";
  errorBox.classList.remove("show");      // reset animation
  void errorBox.offsetWidth;              // reflow để trigger lại
  errorBox.classList.add("show");
  passwordInput.classList.add("error");
  usernameInput.classList.add("error");
  passwordInput.value = "";
  passwordInput.focus();
}

function setLoading(on) {
  loginBtn.disabled = on;
  btnText.textContent = on ? "" : "Đăng nhập";
  if (on) {
    const spinner = document.createElement("div");
    spinner.className = "spinner";
    spinner.id = "loginSpinner";
    loginBtn.appendChild(spinner);
  } else {
    document.getElementById("loginSpinner")?.remove();
  }
}

async function doLogin() {
  const email    = usernameInput.value.trim();
  const password = passwordInput.value;

  if (!email)    { usernameInput.focus(); return; }
  if (!password) { passwordInput.focus(); return; }

  setLoading(true);

  try {
    /* 1) Đăng nhập bằng Supabase Auth thật (auth.users) */
    const { data: authData, error: authError } = await client.auth.signInWithPassword({
      email,
      password,
    });

    if (authError) {
      showError(
        authError.message?.includes("Invalid login credentials")
          ? "Email hoặc mật khẩu không đúng."
          : "Lỗi đăng nhập: " + authError.message
      );
      return;
    }

    /* 2) Lấy hồ sơ quản trị tương ứng trong admin_users (role,
       display_name, is_active) qua cột liên kết auth_user_id.
       ⚠️ Bảng admin_users PHẢI có cột auth_user_id (uuid) trỏ tới
       auth.users(id), và mỗi tài khoản admin phải có đúng 1 dòng
       tương ứng — xem hướng dẫn migration đã trao đổi. */
    const { data: profile, error: profileError } = await client
      .from("admin_users")
      .select("id, username, display_name, role, is_active")
      .eq("auth_user_id", authData.user.id)
      .maybeSingle();

    if (profileError) {
      showError("Lỗi tải hồ sơ quản trị: " + profileError.message);
      await client.auth.signOut();
      return;
    }

    if (!profile) {
      showError("Tài khoản này chưa được cấp quyền quản trị. Liên hệ Super Admin.");
      await client.auth.signOut();
      return;
    }

    if (profile.is_active === false) {
      showError("Tài khoản này đã bị vô hiệu hoá. Vui lòng liên hệ Super Admin.");
      await client.auth.signOut();
      return;
    }

    /* 3) Cập nhật last_login (fire-and-forget) */
    client.from("admin_users")
      .update({ last_login: new Date().toISOString() })
      .eq("id", profile.id)
      .then(() => {});

    /* Hiện success — session đã được supabase-js tự lưu, không cần
       tự ghi sessionStorage nữa */
    loginBody.style.display = "none";
    successFlash.classList.add("show");

    setTimeout(() => location.replace(DASHBOARD), 1700);

  } catch (err) {
    console.error(err);
    showError("Lỗi kết nối. Vui lòng thử lại.");
  } finally {
    setLoading(false);
  }
}

loginBtn.addEventListener("click", doLogin);

/* ── FOCUS AUTO ── */
window.addEventListener("load", () => usernameInput.focus());
</script>
</body>
</html>
