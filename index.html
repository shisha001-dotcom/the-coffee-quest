<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>The Coffee Quest</title>

  <!-- Preconnect sớm tới các dịch vụ external quan trọng -->
  <link rel="preconnect" href="https://dklfwlgpomnrmxmbjpat.supabase.co">
  <link rel="preconnect" href="https://doublevcute-default-rtdb.asia-southeast1.firebasedatabase.app">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/base/variables.css"/>
  <link rel="stylesheet" href="css/base/reset.css"/>
  <link rel="stylesheet" href="css/base/header-menu.css"/>
  <link rel="stylesheet" href="css/base/news-banner.css"/>
  <link rel="stylesheet" href="css/base/boardgame-list.css"/>
  <link rel="stylesheet" href="css/base/boardgame-detail.css"/>
  <link rel="stylesheet" href="css/base/pages.css"/>
  <link rel="stylesheet" href="css/base/modals.css"/>
  <link rel="stylesheet" href="css/base/responsive.css"/>
  <link rel="stylesheet" href="css/chat.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
</head>  
<body>

<!-- ══ SKIP LINK — MỚI (UI/UX audit: cho phép người dùng bàn phím /
     screen reader nhảy thẳng tới nội dung, bỏ qua header + side menu) ══ -->
<a href="#app" class="skip-link">Chuyển tới nội dung chính</a>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <button id="menu-toggle" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="side-menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <a class="logo" href="#news" onclick="goNews()">☕ <span>The Coffee</span>Quest</a>
  <div class="search-wrap" id="header-search" style="display:none">
    <label for="searchInput" class="sr-only">Tìm board game</label>
    <input type="text" id="searchInput" placeholder="Tìm board game…" autocomplete="off"/>
    <div class="search-icon" aria-hidden="true">🔍</div>
  </div>
  <div class="header-count" id="header-count-wrap" style="display:none">
    Hiển thị <b id="countNum">0</b> game
  </div>
</header>

<!-- ══ SIDE MENU ══ -->
<div id="side-menu" role="navigation" aria-label="Menu chính">
  <div class="menu-header">
    <div class="menu-logo" aria-hidden="true">☕</div>
    <div>
      <div class="menu-title">The Coffee Quest</div>
      <div class="menu-sub">Coffee &amp; Boardgame</div>
    </div>
  </div>
  <div class="menu-item" onclick="goNews()">📰 Tin tức - Daily Quest</div>
  <div class="menu-item" onclick="goBoardgame()">🎲 Luật Boardgame</div>
  <div class="menu-item" onclick="goContact()">📍 Thông tin liên hệ</div>
  <div class="menu-item" onclick="goMembership()">🎮 Thẻ thành viên</div>
  <div class="menu-item" onclick="goSettings()">⚙️ Cài đặt cá nhân</div>
</div>
<div id="menu-overlay"></div>

<!-- ══ PAGE CONTENT ══ -->
<div id="app" tabindex="-1"></div>

<!-- ══ LIGHTBOX ══ -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh phóng to">
  <button id="lb-close" onclick="closeLb()" aria-label="Đóng ảnh phóng to">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/>
    </svg>
  </button>
  <img id="lb-img" src="" alt=""/>
  <div id="lb-caption"></div>
</div>

<!-- ══ USERNAME MODAL ══ -->
<div id="username-modal" role="dialog" aria-modal="true" aria-labelledby="username-modal-title">
  <div class="username-card">
    <div class="username-logo" aria-hidden="true">💬</div>
    <h2 id="username-modal-title">Tên của bạn là gì?</h2>
    <p>Nhập tên để tham gia chat cộng đồng</p>
    <label for="username-input" class="sr-only">Tên hiển thị</label>
    <input type="text" id="username-input" placeholder="Nhập tên..." maxlength="30"/>
    <button id="username-save">Bắt đầu ☕</button>
  </div>
</div>

<!-- ══ CHAT ══ -->
<button id="chat-toggle" aria-label="Mở khung chat cộng đồng" aria-expanded="false" aria-controls="chat-window">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>
<div id="chat-window" role="dialog" aria-label="Chat cộng đồng">
  <div class="chat-header">
    <div class="chat-title">
      <div class="online-dot" aria-hidden="true"></div>
      <h3>Cộng đồng</h3>
    </div>
    <button id="chat-close" aria-label="Đóng khung chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/>
      </svg>
    </button>
  </div>
  <div class="chat-online">👥 Đang online: <span id="online-count">0</span> người</div>
  <div id="chat-messages" role="log" aria-live="polite" aria-label="Tin nhắn chat"></div>

  <!-- EMOJI PICKER POPUP -->
  <div id="emoji-picker" class="emoji-picker hidden" role="dialog" aria-label="Chọn emoji">
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>

  <div class="chat-input-wrap">
    <button id="emoji-toggle" title="Emoji" aria-label="Mở bảng chọn emoji" aria-expanded="false" aria-controls="emoji-picker">😊</button>
    <label for="chat-input" class="sr-only">Nhập tin nhắn</label>
    <input type="text" id="chat-input" placeholder="Nhập tin nhắn..."/>
    <button id="chat-send">Gửi</button>
  </div>
</div>

<!-- ══ SCRIPTS — thứ tự quan trọng ══ -->
<script src="js/shared-config.js"></script>
<script src="js/shared-emoji.js"></script>
<script src="js/shared-categories.js"></script>
<script src="js/shared-utils.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/membership.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/chat.js"></script>
  
</body>
</html>
