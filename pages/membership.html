<div id="page-membership" class="page active">

  <div class="membership-page">

    <h1>🎮 Thẻ Thành Viên — Coffee Quest</h1>
    <p class="membership-sub">Nhập số điện thoại đã đăng ký tại quầy để xem cấp độ, XP và ưu đãi hiện tại</p>

    <div class="membership-lookup">
      <label for="member-phone-input" class="sr-only">Số điện thoại</label>
      <input
        type="tel"
        id="member-phone-input"
        placeholder="Nhập số điện thoại... (VD: 0912345678)"
        inputmode="tel"
        autocomplete="tel"
        maxlength="14"
      >
      <button id="member-lookup-btn" type="button">🔍 Tra cứu</button>
    </div>

    <div id="member-result"></div>

  </div>

</div>
